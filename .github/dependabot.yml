# Feeds from nuget.config must be declared here (anonymous, no credentials)
# or Dependabot blocks them and NuGet update jobs fail.
registries:
  nuget-org:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json
  dotnet-eng:
    type: nuget-feed
    url: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json
  dotnet9:
    type: nuget-feed
    url: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet9/nuget/v3/index.json
  dotnet9-transport:
    type: nuget-feed
    url: https://dnceng.pkgs.visualstudio.com/public/_packaging/dotnet9-transport/nuget/v3/index.json
updates:
- directory: /
  ignore:
  - dependency-name: "Aspire.Hosting"
  - dependency-name: "Aspire.Hosting.*"
  labels:
  - dependencies
  - nuget
  - skip-nuget-publish
  open-pull-requests-limit: 10
  package-ecosystem: nuget
  registries:
  - nuget-org
  - dotnet-eng
  - dotnet9
  - dotnet9-transport
  schedule:
    interval: weekly

- directories:
  - / # Includes .github/workflows.
  - "/.github/actions/*" # Includes local composite actions.
  groups:
    actions-by-name:
      group-by: dependency-name
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  - github-actions
  - skip-nuget-publish
  open-pull-requests-limit: 10
  package-ecosystem: github-actions
  schedule:
    interval: weekly

- directories:
  - "**/*"
  groups:
    vitest: # Must precede dependencies-by-name; Dependabot uses the first matching group.
      patterns:
      - "vitest"
      - "@vitest/*"
    dependencies-by-name:
      group-by: dependency-name
  labels:
  - dependencies
  - npm
  - skip-nuget-publish
  open-pull-requests-limit: 10
  package-ecosystem: npm
  schedule:
    interval: weekly
version: 2
