updates:
- directory: /
  ignore:
  - dependency-name: "Aspire.Hosting"
  - dependency-name: "Aspire.Hosting.*"
  labels:
  - dependencies
  - skip-nuget-publish
  package-ecosystem: nuget
  schedule:
    interval: weekly
- directories:
  - / # Includes .github/workflows.
  - "/.github/actions/*" # Includes local composite actions.
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  - skip-nuget-publish
  package-ecosystem: github-actions
  schedule:
    interval: weekly
- directories:
  - "**/*"
  groups:
    vitest:
      patterns:
      - "vitest"
      - "@vitest/*"
  labels:
  - dependencies
  - skip-nuget-publish
  package-ecosystem: npm
  schedule:
    interval: weekly
version: 2
